[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alaetheia"
version = "0.2.0"
description = "Alaetheia typed discovery and deterministic workflow laboratory"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
alaetheia = "alaetheia.cli:main"
